
services:
  nvc-web:
    build: .
    container_name: nvc-web
    ports:
      - "4000:4000"
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
  
  nginx:
    image: nginx:stable
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certbot/www:/var/www/certbot
      # - ./certbot/conf:/etc/letsencrypt
      - ./ssl:/etc/ssl/futurefoods:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nvc-web
    restart: always

