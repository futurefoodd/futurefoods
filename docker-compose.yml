
services:
  nvc-web:
    build: .
    container_name: nvc-web
    ports:
      - "4000:4000"
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
  
  nginx:
    image: nginx:stable
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nvc-web
    restart: always

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./nginx.conf:/etc/nginx/nginx.conf
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
       while :; do
         certbot renew --quiet;
         sleep 12h & wait $${!};
       done"
    restart: always