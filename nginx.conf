
#user  nobody;
worker_processes  auto;

http {
  server {
    listen 80;
    server_name futurefoods.com.my www.futurefoods.com.my;

    location / {
      proxy_pass http://nvc-web:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Redirect HTTP to HTTPS
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name futurefoods.com.my www.futurefoods.com.my;

    ssl_certificate /etc/letsencrypt/live/futurefoods.com.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futurefoods.com.my/privkey.pem;

    location / {
      proxy_pass http://nvc-web:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;
    }
  }
}





