
<div class="nutrition-consult-form">
  <div class="info-image">
    <img src="dietetics_logo.webp" >
  
  </div>
    <h2>REQUEST FOR NUTRITION CONSULT</h2>
  
    <form [formGroup]="consultForm" (ngSubmit)="onSubmit()">
      <!-- Basic Info -->
      <div class="form-section">
        <label>Name:<span style="color: red;">*</span></label>
        <input type="text" formControlName="name" />
  
        <label>Age:<span style="color: red;">*</span></label>
        <input type="number" formControlName="age" min="0"/>

        <label>Contact Number:<span style="color: red;">*</span></label>
        <input type="text" formControlName="contact" />

        <label>Email:<span style="color: red;">*</span></label>
        <input type="text" formControlName="email" />
  
        <label>Sex:<span style="color: red;">*</span></label>
        <div class="radio-group">
          <label><input type="radio" value="Male" formControlName="sex" /> Male</label>
          <label><input type="radio" value="Female" formControlName="sex" /> Female</label>
        </div>
      </div>
  
      <div class="form-section">
        <label>Height (cm):<span style="color: red;">*</span></label>
        <input type="number" formControlName="height" min="0" />
  
        <label>Weight (kg):<span style="color: red;">*</span></label>
        <input type="number" formControlName="weight" min="0" />
  
        <label>Country:<span style="color: red;">*</span></label>
        <input type="text" formControlName="country" />
      </div>
  
      <!-- Lifestyle & Habits -->
      <h3>Lifestyle & Habits</h3>
  
      <label>Daily Activity Level:<span style="color: red;">*</span></label>
      <div class="radio-group">
        <label><input type="radio" value="Sedentary" formControlName="activityLevel" /> Sedentary (&lt;2000 steps)</label>
        <label><input type="radio" value="Moderate" formControlName="activityLevel" /> Moderate (5000 steps)</label>
        <label><input type="radio" value="Active" formControlName="activityLevel" /> Active (10000 steps)</label>
      </div>
  
      <label>Exercise Routine:<span style="color: red;">*</span></label>
      <div class="checkbox-group">
        <label *ngFor="let routine of exerciseOptions">
          <input type="checkbox" [value]="routine" (change)="onCheckboxChange($event, 'exerciseRoutine')" />
          {{ routine }}
        </label>
      </div>
  
      <label>Exercise Frequency:<span style="color: red;">*</span></label>
      <div class="radio-group">
        <label><input type="radio" value="Weekends" formControlName="exerciseFrequency" /> Weekends</label>
        <label><input type="radio" value="3 times a week" formControlName="exerciseFrequency" /> 3 times a week</label>
        <label><input type="radio" value="Daily" formControlName="exerciseFrequency" /> Daily</label>
        <label><input type="radio" value="None" formControlName="exerciseFrequency" /> None</label>
      </div>
  
      <label>Job Demands or Hazard:<span style="color: red;">*</span></label>
      <div class="checkbox-group">
        <label *ngFor="let job of jobOptions">
          <input type="checkbox" [value]="job" (change)="onCheckboxChange($event, 'jobDemands')" />
          {{ job }}
        </label>
      </div>
  
      <label>Typical Sleep Hours per Night:<span style="color: red;">*</span></label>
      <div class="radio-group">
        <label><input type="radio" value="4" formControlName="sleepHours" /> 4 hrs</label>
        <label><input type="radio" value="6" formControlName="sleepHours" /> 6 hrs</label>
        <label><input type="radio" value="8" formControlName="sleepHours" /> 8 hrs</label>
      </div>
  
      <label>Smoking | Vaping Use:<span style="color: red;">*</span></label>
      <div class="radio-group">
        <label><input type="radio" value="Social" formControlName="smokingVaping" /> Social</label>
        <label><input type="radio" value="Habitual" formControlName="smokingVaping" /> Habitual</label>
        <label><input type="radio" value="None" formControlName="smokingVaping" /> None</label>
      </div>
  
      <label>Alcochol Consumption:<span style="color: red;">*</span></label>
      <ng-container formGroupName="alcoholGroup">
        <div class="checkbox-group" style="margin-bottom: 0px;">
          <label *ngFor="let item of alcohol">
            <input type="checkbox" [value]="item" (change)="onCheckboxChange($event, 'alcoholGroup.types')" />
            {{ item }}
          </label>
        </div>
        <div class="radio-group">
          <label><input type="radio" value="Social" formControlName="consumption" /> Social</label>
          <label><input type="radio" value="Habitual" formControlName="consumption" /> Habitual</label>
          <label><input type="radio" value="None" formControlName="consumption" /> None</label>
        </div>
      </ng-container>

      <label>Dietary Patterns:<span style="color: red;">*</span></label>
      <div class="checkbox-group">
        <label *ngFor="let pattern of dietPatterns">
          <input type="checkbox" [value]="pattern" (change)="onCheckboxChange($event, 'dietaryPatterns')" />
          {{ pattern }}
        </label>
      </div>
  
      <label>Usual Eating Style:<span style="color: red;">*</span></label>
      <div class="checkbox-group">
        <label *ngFor="let style of eatingStyles">
          <input type="checkbox" [value]="style" (change)="onCheckboxChange($event, 'eatingStyle')" />
          {{ style }}
        </label>
      </div>
  
      <label>Daily Water Intake:<span style="color: red;">*</span></label>
      <div class="radio-group">
        <label><input type="radio" value="2-3" formControlName="waterIntake" /> 2–3 glass</label>
        <label><input type="radio" value="4-6" formControlName="waterIntake" /> 4–6 glass</label>
        <label><input type="radio" value="8-10" formControlName="waterIntake" /> 8–10 glass</label>
      </div>
  
      <label>Coffee / Tea / Sugary Drinks / Snacks:<span style="color: red;">*</span></label>
    <ng-container formGroupName="snackGroup">
      <div class="checkbox-group" style="margin-bottom: 0px;">
        <label *ngFor="let snack of snacks">
          <input type="checkbox" [value]="snack" (change)="onCheckboxChange($event, 'snackGroup.types')" />
          {{ snack }}
        </label>
      </div>
      <div class="radio-group">
        <label><input type="radio" value="When Stressed" formControlName="frequency" /> When Stressed</label>
        <label><input type="radio" value="Often" formControlName="frequency" /> Often</label>
        <label><input type="radio" value="Sometimes" formControlName="frequency" /> Sometimes</label>
        <label><input type="radio" value="Rarely" formControlName="frequency" /> Rarely</label>
      </div>
    </ng-container>
  
      <!-- Wellness Goals -->
      <h3>Wellness Goals</h3>
  
      <label>Primary Goal:<span style="color: red;">*</span></label>
      <div class="radio-group">
        <label *ngFor="let goal of primaryGoals">
          <input type="radio" [value]="goal" formControlName="primaryGoal" /> {{ goal }}
        </label>
      </div>
  
      <label>Secondary Goals:<span style="color: red;">*</span></label>
      <div class="checkbox-group">
        <label *ngFor="let goal of secondaryGoals">
          <input type="checkbox" [value]="goal" (change)="onCheckboxChange($event, 'secondaryGoals')" />
          {{ goal }}
        </label>
      </div>
  
      <label>Specific Concerns:<span style="color: red;">*</span></label>
      <div class="checkbox-group">
        <label *ngFor="let concern of concerns">
          <input type="checkbox" [value]="concern" (change)="onCheckboxChange($event, 'specificConcerns')" />
          {{ concern }}
        </label>
      </div>
  
      <!-- Additional Info -->
      <h3>Additional Info</h3>
  
      <label>Supplements Currently Taken:</label>
      <textarea formControlName="supplements"></textarea>
  
      <label>Family History of Health Issues:</label>
      <div class="checkbox-group">
        <label *ngFor="let issue of familyHistoryOptions">
          <input type="checkbox" [value]="issue" (change)="onCheckboxChange($event, 'familyHistory')" />
          {{ issue }}
        </label>
      </div>
  
      <label><input type="checkbox" formControlName="recentHospitalisation" /> Recent Hospitalisation</label>
      <label><input type="checkbox" formControlName="yearlyScreening" /> Yearly Medical Screening</label>
      <label><input type="checkbox" formControlName="foodAllergy" /> Any Food Allergy</label>
      <label><input type="checkbox" formControlName="medication" /> Presently on Medication</label>
      <label><input type="checkbox" formControlName="recentTravel" /> Recent Travel Abroad</label>

      <p class="privacy-note">
  By clicking <strong>Submit</strong>, you acknowledge that you have read and agree to our
  <!-- <a href="/data-privacy" target="_blank">Data Privacy</a> and  -->
  <a href="/privacy-policy" target="_blank">Privacy Policy</a> and that your personal data will be processed in accordance with the 
  <strong>Personal Data Protection Act 2010 (PDPA)</strong>.
</p>
  
      <button type="submit">Submit</button>
    </form>
  </div>
